<main class="main" id="top">
  <app-navbar></app-navbar>
  <div class="content">
    <div class="pb-6">
      <div
        class="border-bottom border-translucent mb-2 mx-n3 px-2 mx-lg-n6 px-lg-6"
      >
        <div class="row">
          <div class="col-xl-10">
            <div class="d-sm-flex justify-content-between">
              <h4 class="mb-4">
                {{ itemgroup.itemGroupGuid ? "Update" : "Create" }} Item Group
              </h4>
            </div>
          </div>
        </div>
      </div>
      <form class="row g-3" (ngSubmit)="onSubmit()" #taxForm="ngForm">
        <div class="col-md-4">
          <label class="form-label" for="code">Code</label>
          <input
            class="form-control"
            id="code"
            name="code"
            type="text"
            [(ngModel)]="itemgroup.itemGroupName"
            required
          />
        </div>
        <div class="col-md-4">
          <label class="form-label" for="description">Description </label>
          <input
            class="form-control"
            id="description"
            name="description"
            type="text"
            [(ngModel)]="itemgroup.description"
            required
          />
        </div>
        <div class="col-12">
          <div class="form-check">
            <input
              class="form-check-input"
              id="isActive"
              name="isActive"
              type="checkbox"
              [(ngModel)]="itemgroup.isActive"
              [disabled]="isActiveDisabled"
            />
            <label class="form-check-label" for="isActive">Is Active</label>
          </div>
        </div>
        <div class="col-12">
          <button class="btn btn-primary" type="submit" [disabled]="loading">
            <span
              *ngIf="loading"
              class="spinner-border spinner-border-sm me-2"
            ></span>
            {{ itemgroup.itemGroupGuid ? "Update" : "Submit" }}
          </button>

          <button
            class="btn btn-phoenix-secondary me-2 mb-2 mb-sm-0 ml-2"
            type="button"
            [routerLink]="['/item-group']"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>
    <app-footer></app-footer>
  </div>
</main>
